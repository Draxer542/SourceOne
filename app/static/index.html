<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic RAG</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 800px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 2.5rem;
        background: linear-gradient(to right, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }

      .card {
        background-color: var(--card-bg);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      h2 {
        margin-top: 0;
        font-size: 1.25rem;
        color: var(--text-primary);
        margin-bottom: 1rem;
      }

      /* Upload Section */
      .upload-area {
        border: 2px dashed var(--text-secondary);
        border-radius: 0.75rem;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .upload-area:hover {
        border-color: var(--accent);
        background-color: rgba(59, 130, 246, 0.05);
      }

      .file-input {
        display: none;
      }

      .btn {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn:hover {
        background-color: var(--accent-hover);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #file-list {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .file-item {
        background-color: rgba(255, 255, 255, 0.05);
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Chat Section */
      .chat-box {
        height: 400px;
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background-color: rgba(0, 0, 0, 0.2);
      }

      .message {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 1rem;
        line-height: 1.5;
      }

      .message.user {
        align-self: flex-end;
        background-color: var(--accent);
        color: white;
        border-bottom-right-radius: 0.25rem;
      }

      .message.bot {
        align-self: flex-start;
        background-color: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        border-bottom-left-radius: 0.25rem;
      }

      .input-group {
        display: flex;
        gap: 0.5rem;
      }

      input[type="text"] {
        flex: 1;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.5rem;
        padding: 0.75rem;
        color: white;
        font-family: inherit;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      .status {
        font-size: 0.875rem;
        margin-top: 0.5rem;
        min-height: 1.25rem;
      }

      .status.success {
        color: var(--success);
      }
      .status.error {
        color: var(--error);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Agentic RAG</h1>
        <p style="color: var(--text-secondary)">
          Upload documents and ask questions
        </p>
      </header>

      <!-- Upload Section -->
      <div class="card">
        <h2>1. Ingestion Layer</h2>
        <div
          class="upload-area"
          onclick="document.getElementById('fileInput').click()"
        >
          <p>Click to select files (PDF, MD, TXT, DOCX)</p>
          <p style="font-size: 0.8rem; color: var(--text-secondary)">
            Max 3 files
          </p>
          <input
            type="file"
            id="fileInput"
            class="file-input"
            multiple
            onchange="handleFileSelect(event)"
          />
        </div>
        <div id="file-list"></div>
        <div style="margin-top: 1rem; text-align: right">
          <button id="uploadBtn" class="btn" onclick="uploadFiles()" disabled>
            Process Files
          </button>
        </div>
        <div id="uploadStatus" class="status"></div>
      </div>

      <!-- Chat Section -->
      <div class="card">
        <h2>2. Retrieval & Generation Layer</h2>
        <div class="chat-box" id="chatBox">
          <div class="message bot">
            Hello! Upload some documents above, and then ask me anything about
            them.
          </div>
        </div>
        <div class="input-group">
          <input
            type="text"
            id="queryInput"
            placeholder="Ask a question..."
            onkeypress="handleKeyPress(event)"
          />
          <button class="btn" onclick="sendQuery()">Send</button>
        </div>
      </div>
    </div>

    <script>
      let selectedFiles = [];

      function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        if (files.length > 3) {
          alert("Maximum 3 files allowed.");
          return;
        }
        selectedFiles = files;
        updateFileList();
        document.getElementById("uploadBtn").disabled = files.length === 0;
      }

      function updateFileList() {
        const list = document.getElementById("file-list");
        list.innerHTML = "";
        selectedFiles.forEach((file) => {
          const item = document.createElement("div");
          item.className = "file-item";
          item.textContent = file.name;
          list.appendChild(item);
        });
      }

      async function uploadFiles() {
        const btn = document.getElementById("uploadBtn");
        const status = document.getElementById("uploadStatus");

        btn.disabled = true;
        btn.textContent = "Processing...";
        status.textContent = "";
        status.className = "status";

        const formData = new FormData();
        selectedFiles.forEach((file) => {
          formData.append("files", file);
        });

        try {
          const response = await fetch("/api/v1/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (response.ok) {
            status.textContent = "✓ " + data.message;
            status.className = "status success";
          } else {
            throw new Error(data.detail || "Upload failed");
          }
        } catch (error) {
          status.textContent = "✗ " + error.message;
          status.className = "status error";
        } finally {
          btn.disabled = false;
          btn.textContent = "Process Files";
        }
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") {
          sendQuery();
        }
      }

      async function sendQuery() {
        const input = document.getElementById("queryInput");
        const query = input.value.trim();

        if (!query) return;

        // Add user message
        addMessage(query, "user");
        input.value = "";

        // Show loading state (optional, could add a typing indicator)

        try {
          const response = await fetch("/api/v1/query", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ query: query }),
          });

          const data = await response.json();

          if (response.ok) {
            addMessage(data.answer, "bot");
          } else {
            addMessage(
              "Error: " + (data.detail || "Failed to get answer"),
              "bot"
            );
          }
        } catch (error) {
          addMessage("Error: " + error.message, "bot");
        }
      }

      function addMessage(text, type) {
        const box = document.getElementById("chatBox");
        const msg = document.createElement("div");
        msg.className = `message ${type}`;
        msg.textContent = text;
        box.appendChild(msg);
        box.scrollTop = box.scrollHeight;
      }
    </script>
  </body>
</html>
